name = "ghealthe-tv-boards"
main = "src/index.js"
compatibility_date = "2026-07-01"

# D1 database. Create it once with:
#   npx wrangler d1 create ghealthe_tv
# then paste the database_id it prints below and run:
#   npm run db:init
[[d1_databases]]
binding = "DB"
database_name = "ghealthe_tv"
database_id = "5fa2a007-b31d-4ffe-930f-9d6d99182dc7"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   BOARD_KEY            unguessable token required as ?key= on board/API URLs
#   INGEST_SECRET        bearer token the Claude Routine uses on POST /ingest
#   ONYX_SIGNING_SECRET  Onyx webhook signing secret (milestone 3)

# Board imagery is bundled with the Worker and served from /assets/*, so the
# pages stay self-contained and the board key still gates every read. Whole
# files count against the Worker's 3 MiB size limit, so keep them small —
# photographic flyers as JPEG, not PNG.
[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg"]
fallthrough = true

# Board pages that came in as finished HTML are kept as .html and imported as
# text, rather than pasted into a JS template literal: no escaping, and the
# file stays something a browser can open and a diff can read.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
