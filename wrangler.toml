name = "ghealthe-tv-boards"
main = "src/index.js"
compatibility_date = "2026-07-01"

# D1 database. Create it once with:
#   npx wrangler d1 create ghealthe_tv
# then paste the database_id it prints below and run:
#   npm run db:init
[[d1_databases]]
binding = "DB"
database_name = "ghealthe_tv"
database_id = "5fa2a007-b31d-4ffe-930f-9d6d99182dc7"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   BOARD_KEY            unguessable token required as ?key= on board/API URLs
#   INGEST_SECRET        bearer token the Claude Routine uses on POST /ingest
#   ONYX_SIGNING_SECRET  Onyx webhook signing secret (milestone 3)
