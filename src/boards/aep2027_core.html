<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0B1E4D}
  body{font-family:'Inter',system-ui,sans-serif}

  /* ══ Royal Platinum ══ */
  :root{
    --field:#0B1E4D; --panel:#152F6B; --line:#2A4A91;
    --paper:#F4F7FD; --mute:#92A9D4;
    --accent:#3D7BFF; --hot:#F0C24A;
    --band:#F0C24A; --bandtxt:#0B1E4D;
  }

  /* fixed stage, JS-scaled — cannot silently overflow */
  /* The 1920x1080 design is laid out in --u, one design pixel as a share of
     the screen (like the appointment tracker's vw/vh), so the browser fits it
     to any TV with no script. Letterboxed on screens that aren't 16:9. */
  :root{--u:calc(100vw / 1920)}
  @media (min-aspect-ratio: 16/9){ :root{--u:calc(100vh / 1080)} }
  #stage{position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;
         width:calc(1920*var(--u));height:calc(1080*var(--u));
         background:var(--field);overflow:hidden}

  /* ───────────────────────── LEADERBOARD ───────────────────────── */
  #board{position:absolute;inset:0;display:flex;flex-direction:column}

  .bh{height:calc(140*var(--u));flex:0 0 auto;display:flex;align-items:center;gap:calc(26*var(--u));
      padding:0 calc(44*var(--u));background:var(--panel);border-bottom:calc(3*var(--u)) solid var(--line)}
  .logo-slot{height:calc(72*var(--u));width:auto;display:flex;align-items:center;flex:0 0 auto}
  .logo-slot img{height:calc(72*var(--u));width:auto;display:block}
  .logo-fallback{height:calc(72*var(--u));min-width:calc(210*var(--u));border:calc(2*var(--u)) dashed var(--mute);border-radius:calc(4*var(--u));
       display:flex;align-items:center;justify-content:center;padding:0 calc(16*var(--u));
       font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(17*var(--u));
       letter-spacing:.1em;color:var(--mute);text-align:center;line-height:1.15}
  .ttl{display:flex;flex-direction:column;gap:calc(1*var(--u))}
  .ttl b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(56*var(--u));
         line-height:.95;letter-spacing:.022em;color:var(--paper)}
  .ttl b em{font-style:normal;color:var(--hot)}
  .ttl span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(21*var(--u));
            letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
  .hmeta{margin-left:auto;display:flex;align-items:center;gap:calc(34*var(--u))}
  .hstat{text-align:right}
  .hstat i{display:block;font-style:normal;font-family:'Barlow Condensed',sans-serif;
           font-weight:600;font-size:calc(17*var(--u));letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
  .hstat b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(40*var(--u));
           letter-spacing:.02em;color:var(--paper);line-height:1}
  .dot{width:calc(13*var(--u));height:calc(13*var(--u));border-radius:50%;background:#3FD68A;flex:0 0 auto}
  .dot.stale{background:var(--hot)} .dot.dead{background:#E2564D}

  .main{flex:1 1 auto;display:flex;gap:calc(22*var(--u));padding:calc(22*var(--u)) calc(44*var(--u));min-height:0}
  .ranks{flex:1 1 auto;display:flex;flex-direction:column;gap:calc(9*var(--u));min-height:0}

  .row{flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;
       background:var(--panel);border:calc(2*var(--u)) solid var(--line);border-radius:calc(6*var(--u));
       padding:0 calc(22*var(--u));gap:calc(20*var(--u));overflow:hidden}
  .row .bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.30;width:0}
  /* Rank 1's bar is always 100% wide, so the row goes solid gold with dark
     text rather than a muddy gold-over-navy wash. */
  .row.r1{background:var(--hot);border-color:var(--hot)}
  .row.r1 .bar{display:none}
  .row > *{position:relative;z-index:1}
  .row .rk{font-family:'Barlow Condensed',sans-serif;font-weight:800;
           color:var(--mute);width:calc(62*var(--u));flex:0 0 auto;text-align:center}
  .row.r1 .rk{color:var(--bandtxt);opacity:.72}
  .row .nm{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--paper);
           flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:.015em}
  .row .sub{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--mute);
            letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto;text-align:right}
  .row.r1 .nm,.row.r1 .ct{color:var(--bandtxt)}
  .row.r1 .sub{color:var(--bandtxt);opacity:.66}
  .row .ct{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--paper);
           flex:0 0 auto;width:calc(120*var(--u));text-align:right;line-height:1}
  .empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:calc(14*var(--u));border:calc(2*var(--u)) dashed var(--line);border-radius:calc(8*var(--u))}
  .empty b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(64*var(--u));
           letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
  .empty span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(27*var(--u));
              letter-spacing:.14em;text-transform:uppercase;color:var(--line)}

  .rail{width:calc(362*var(--u));flex:0 0 auto;display:flex;flex-direction:column;gap:calc(14*var(--u))}
  .rbox{background:var(--panel);border:calc(2*var(--u)) solid var(--line);border-radius:calc(6*var(--u));
        padding:calc(20*var(--u));text-align:center;display:flex;flex-direction:column;justify-content:center;gap:calc(2*var(--u))}
  .rbox.hero{flex:1 1 auto;background:var(--accent);border-color:var(--accent)}
  .rbox i{font-style:normal;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(22*var(--u));
          letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .rbox b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(104*var(--u));
          line-height:.84;color:var(--paper)}
  .rbox span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(19*var(--u));
             letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
  .rbox.hero i,.rbox.hero span{color:#06123A;opacity:.84}
  .rbox.hero b{font-size:calc(168*var(--u));color:#06123A}
  .rsplit{display:flex;gap:calc(14*var(--u))}
  .rsplit .rbox{flex:1 1 0;padding:calc(16*var(--u)) calc(10*var(--u))}
  .rsplit .rbox b{font-size:calc(62*var(--u))}

  /* ───────────────────────── TICKER BAND ───────────────────────── */
  #ticker{height:calc(150*var(--u));flex:0 0 auto;background:var(--band);display:flex;align-items:stretch;
          overflow:hidden;position:relative}
  #ticker .tlab{flex:0 0 auto;width:calc(268*var(--u));background:var(--bandtxt);display:flex;flex-direction:column;
                align-items:center;justify-content:center;gap:calc(2*var(--u));z-index:3}
  #ticker .tlab b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(46*var(--u));
                  letter-spacing:.05em;color:var(--hot);line-height:.95}
  #ticker .tlab span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(19*var(--u));
                     letter-spacing:.17em;text-transform:uppercase;color:#92A9D4}
  #ticker .tview{flex:1 1 auto;position:relative;overflow:hidden}
  #ticker .ttrack{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;
                  white-space:nowrap;will-change:transform}
  .titem{display:inline-flex;align-items:center;gap:calc(17*var(--u));padding:0 calc(44*var(--u));height:100%}
  .titem .tdot{width:calc(17*var(--u));height:calc(17*var(--u));border-radius:50%;background:var(--bandtxt);flex:0 0 auto}
  .titem .tnm{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(54*var(--u));
              letter-spacing:.02em;color:var(--bandtxt);line-height:1}
  .titem .tpl{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(34*var(--u));
              letter-spacing:.04em;color:var(--bandtxt);opacity:.74;line-height:1}
  .titem .tat{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(30*var(--u));
              letter-spacing:.08em;color:var(--bandtxt);opacity:.56;line-height:1}
  .titem .sep{width:calc(9*var(--u));height:calc(9*var(--u));transform:rotate(45deg);background:var(--bandtxt);opacity:.4}
  .titem.idle .tnm{opacity:.62;font-weight:700;font-size:calc(44*var(--u))}

  /* ───────────────────────── INTRO / SHATTER ───────────────────── */
  #intro{position:absolute;inset:0;z-index:50}
  #intro.gone{display:none}
  .shard{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity;
         backface-visibility:hidden}
  .iface{position:absolute;inset:0;background:
          radial-gradient(ellipse at 50% 42%, #1B3F8F 0%, #0B1E4D 58%, #061536 100%);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(30*var(--u))}
  .iface::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 calc(2*var(--u)), transparent calc(2*var(--u)) calc(9*var(--u)))}
  .iface .ilogo{height:calc(150*var(--u));width:auto;display:block;position:relative;z-index:2}
  .iface .ilogo-fb{height:calc(150*var(--u));min-width:calc(470*var(--u));border:calc(3*var(--u)) dashed #5E7FC4;border-radius:calc(8*var(--u));
       display:flex;align-items:center;justify-content:center;padding:0 calc(40*var(--u));position:relative;z-index:2;
       font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(34*var(--u));
       letter-spacing:.12em;color:#8FA9DC;text-align:center;line-height:1.2}
  .iface h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(210*var(--u));
            line-height:.88;letter-spacing:.02em;color:#F4F7FD;position:relative;z-index:2;
            text-shadow:0 calc(5*var(--u)) calc(38*var(--u)) rgba(0,0,0,.52)}
  .iface h1 em{font-style:normal;color:var(--hot)}
  .iface .tag{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:calc(34*var(--u));
              letter-spacing:.34em;text-transform:uppercase;color:#8FA9DC;position:relative;z-index:2}
  .iface .wait{position:absolute;bottom:calc(74*var(--u));left:0;right:0;text-align:center;z-index:2;
               font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:calc(30*var(--u));
               letter-spacing:.24em;text-transform:uppercase;color:#6E8FD0}
  .iface .wait b{color:var(--hot)}
  @keyframes breathe{0%,100%{opacity:.52}50%{opacity:1}}
  .iface .wait{animation:breathe 2.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.iface .wait{animation:none;opacity:.85}}

  #flash{position:absolute;inset:0;background:#FFF;opacity:0;pointer-events:none;z-index:60}
  #cracks{position:absolute;inset:0;pointer-events:none;z-index:55;opacity:0}
</style>
</head>
<body>
<div id="stage">

  <!-- ══ LEADERBOARD (revealed) ══ -->
  <div id="board">
    <div class="bh">
      <div class="logo-slot" id="hdrLogo"></div>
      <div class="ttl"><b>AEP <em>2027</em></b><span>Core Leaderboard</span></div>
      <div class="hmeta">
        <div class="hstat"><i>Core today</i><b id="hToday">0</b></div>
        <div class="hstat"><i>Core AEP</i><b id="hAep">0</b></div>
        <div class="hstat"><i>Updated</i><b id="hTime"></b></div>
        <div class="dot" id="hDot"></div>
      </div>
    </div>

    <div class="main">
      <div class="ranks" id="ranks"></div>
      <div class="rail">
        <div class="rbox hero"><i>Selling days</i><b id="rDays"></b><span>left in AEP</span></div>
        <div class="rsplit">
          <div class="rbox"><i>STHHC</i><b id="rSthhc">0</b><span>AEP</span></div>
          <div class="rbox"><i>HI</i><b id="rHi">0</b><span>AEP</span></div>
        </div>
        <div class="rbox"><i>Seats on the board</i><b id="rSeats">0</b><span>agents with a Core</span></div>
      </div>
    </div>

    <div id="ticker">
      <div class="tlab"><b id="tLabNum">0</b><span>Core today</span></div>
      <div class="tview"><div class="ttrack" id="ttrack"></div></div>
    </div>
  </div>

  <!-- ══ INTRO (shatters away) ══ -->
  <div id="intro"></div>
  <svg id="cracks" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
  <div id="flash"></div>
</div>

<script>
(function(){
  "use strict";

  // ── tuning ────────────────────────────────────────────────
  var POLL_MS      = 30000;   // feed re-read
  var STALE_MS     = 180000;  // amber dot past 3 min
  var MAX_ROWS     = 14;      // leaderboard depth
  var WEDGES       = 11;      // shatter: angular slices
  var RINGS        = 3;       // shatter: radial rings
  var SHATTER_MS   = 2100;
  var TICKER_PXPS  = 112;     // ticker scroll speed, px/sec
  var AEP_END      = "2026-12-07";

  var LOGO_SRC = (window.AEP_LOGO || "");   // drop a PNG/SVG path or data URI here

  // ?static freezes the ticker at position 0 — used when exporting the JPG
  // playlist fallback, so the capture never lands mid-scroll on a half word.
  var STATIC = new URLSearchParams(location.search).has("static");

  // ── helpers ───────────────────────────────────────────────
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function etNow(){
    // Eastern "now" regardless of the signage machine's clock setting
    return new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
  }
  function etDateStr(d){
    var p = (d||etNow());
    return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0")+"-"+String(p.getDate()).padStart(2,"0");
  }
  function sellingDaysLeft(){
    var d = etNow(); d.setHours(0,0,0,0);
    var end = new Date(AEP_END+"T00:00:00");
    var n = 0;
    while (d <= end){ var w = d.getDay(); if (w !== 0 && w !== 6) n++; d.setDate(d.getDate()+1); }
    return n;
  }
  function fitText(el, maxPx, minPx){
    var s = maxPx; el.style.fontSize = s+"px";
    while (s > minPx && el.scrollWidth > el.clientWidth - 1){ s -= 0.5; el.style.fontSize = s+"px"; }
  }

  // ── stage scaling: fill any TV, never crop ────────────────
  // One design pixel in screen pixels. The stage scales itself in CSS; the
  // few sizes the script sets follow it.
  function U(){ return ($("stage").getBoundingClientRect().width / 1920) || 1; }
  function fitStage(){
    if (!window.AEP) return;
    render(window.AEP);
    tickerSig = "";
    renderTicker(window.AEP);
  }
  var resizeT = null;
  window.addEventListener("resize", function(){ clearTimeout(resizeT); resizeT = setTimeout(fitStage, 250); });

  // ── logo slots ────────────────────────────────────────────
  function paintLogos(){
    var hdr = $("hdrLogo");
    if (LOGO_SRC){ hdr.innerHTML = '<img src="'+esc(LOGO_SRC)+'" alt="Get Health-e">'; }
    else { hdr.innerHTML = '<div class="logo-fallback">GET HEALTH-E<br>LOGO</div>'; }
  }

  function introMarkup(){
    var mark = LOGO_SRC
      ? '<img class="ilogo" src="'+esc(LOGO_SRC)+'" alt="Get Health-e">'
      : '<div class="ilogo-fb">GET HEALTH-E LOGO</div>';
    // If Core is already on the sheet, the board must not claim to be waiting
    // on the first one -- the floor can see the leaderboard behind it.
    var done = (window.AEP && window.AEP.today && window.AEP.today.core) || 0;
    var wait = done > 0
      ? 'Waiting on the <b>next Core</b>'
      : 'Waiting on the <b>first Core</b> of the day';
    return '<div class="iface">' + mark +
           '<h1>AEP <em>2027</em></h1>' +
           '<div class="tag">Annual Enrollment Period</div>' +
           '<div class="wait">' + wait + '</div>' +
           '</div>';
  }

  // ── build the shard field ─────────────────────────────────
  // Each shard is a full copy of the intro face, clipped to a radial glass
  // fragment. Their union is the intact board until they fly apart.
  var shards = [];
  function buildIntro(){
    var intro = $("intro");
    intro.innerHTML = "";
    shards = [];

    var cx = 50, cy = 46;                  // impact point, % of stage
    var ringR = [0, 20, 46, 96];           // % radii; the last must clear the corners
    var jitter = function(m){ return (Math.random()-0.5)*m; };
    var ASPECT = 16/9;                     // keeps radial shards visually round

    function pt(r, aDeg){
      var a = aDeg*Math.PI/180;
      return [ cx + r*Math.cos(a), cy + r*Math.sin(a)*ASPECT ];
    }

    // ONE shared vertex per (ring, wedge). Neighbouring shards read the same
    // vertex objects, so the field tiles exactly — jitter the vertices, never
    // the shards, or the fragments pull apart and the board shows through.
    var V = [];
    for (var ri = 0; ri <= RINGS; ri++){
      V[ri] = [];
      for (var wi = 0; wi < WEDGES; wi++){
        if (ringR[ri] === 0){ V[ri][wi] = pt(0, 0); continue; }
        var r = ringR[ri] + jitter(6);
        var a = (wi/WEDGES)*360 + jitter((360/WEDGES)*0.42);
        V[ri][wi] = pt(r, a);
      }
      V[ri][WEDGES] = V[ri][0];            // wrap
    }

    var fmt = function(p){ return p[0].toFixed(2)+"% "+p[1].toFixed(2)+"%"; };

    for (var ri2 = 0; ri2 < RINGS; ri2++){
      for (var wi2 = 0; wi2 < WEDGES; wi2++){
        var poly = (ringR[ri2] === 0)
          ? [ V[0][0], V[1][wi2], V[1][wi2+1] ]                                  // centre triangle
          : [ V[ri2][wi2], V[ri2][wi2+1], V[ri2+1][wi2+1], V[ri2+1][wi2] ];      // quad

        var d = document.createElement("div");
        d.className = "shard";
        d.style.clipPath = "polygon(" + poly.map(fmt).join(",") + ")";
        d.innerHTML = introMarkup();

        var am = ((wi2 + 0.5)/WEDGES)*360 * Math.PI/180;
        var dist = 300 + ringR[ri2+1]*7 + Math.random()*260;
        d.dataset.dx  = (Math.cos(am)*dist).toFixed(1);
        d.dataset.dy  = (Math.sin(am)*dist*0.86 + 130).toFixed(1);   // gravity bias
        d.dataset.rot = ((Math.random()-0.5)*150).toFixed(1);
        d.dataset.dly = (ri2*55 + Math.random()*110).toFixed(0);
        intro.appendChild(d);
        shards.push(d);
      }
    }
    drawCracks(V);
  }

  function drawCracks(V){
    var svg = $("cracks");
    var X = function(p){ return (p[0]*19.2).toFixed(0)+" "+(p[1]*10.8).toFixed(0); };
    var d = "", ri, wi;
    for (wi = 0; wi < WEDGES; wi++){                 // radial cracks
      d += "M" + X(V[0][0]);
      for (ri = 1; ri <= RINGS; ri++){ d += "L" + X(V[ri][wi]); }
    }
    for (ri = 1; ri <= RINGS; ri++){                 // concentric cracks
      d += "M" + X(V[ri][0]);
      for (wi = 1; wi <= WEDGES; wi++){ d += "L" + X(V[ri][wi]); }
    }
    svg.innerHTML = '<path d="'+d+'" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>';
  }

  // ── the shatter ───────────────────────────────────────────
  var introLive = true, shattering = false;
  function shatter(){
    if (shattering || !introLive) return;
    shattering = true;

    var fl = $("flash"), cr = $("cracks");
    // impact: crack lines snap in, white flash, then the field flies apart
    cr.style.transition = "opacity 90ms linear";
    cr.style.opacity = "1";
    fl.style.transition = "opacity 70ms linear";
    fl.style.opacity = ".82";

    setTimeout(function(){
      fl.style.transition = "opacity 420ms ease-out";
      fl.style.opacity = "0";
      cr.style.transition = "opacity 260ms ease-out";
      cr.style.opacity = "0";

      shards.forEach(function(s){
        var dly = +s.dataset.dly;
        setTimeout(function(){
          s.style.transition = "transform "+SHATTER_MS+"ms cubic-bezier(.22,.62,.3,1), opacity "+SHATTER_MS+"ms ease-in";
          var u = U();
          s.style.transform = "translate3d("+(s.dataset.dx*u)+"px,"+(s.dataset.dy*u)+"px,0) rotate("+s.dataset.rot+"deg) scale(.82)";
          s.style.opacity = "0";
        }, dly);
      });
    }, 150);

    setTimeout(function(){
      $("intro").classList.add("gone");
      introLive = false;
    }, SHATTER_MS + 700);
  }

  // ── rendering the leaderboard ─────────────────────────────
  function render(d){
    if (!d) return;
    var agents = (d.agents || []).slice().filter(function(a){ return (a.core||0) > 0; });
    agents.sort(function(a,b){ return (b.core-a.core) || a.name.localeCompare(b.name); });

    var t = d.totals || {};
    $("hToday").textContent  = (d.today && d.today.core) || 0;
    $("hAep").textContent    = t.core || 0;
    $("tLabNum").textContent = (d.today && d.today.core) || 0;
    $("rSthhc").textContent  = t.sthhc || 0;
    $("rHi").textContent     = t.hi || 0;
    $("rSeats").textContent  = agents.length;
    $("rDays").textContent   = sellingDaysLeft();

    // freshness dot
    var dot = $("hDot"), age = d.generated_at ? (Date.now() - new Date(d.generated_at).getTime()) : Infinity;
    dot.className = "dot" + (age > STALE_MS*4 ? " dead" : age > STALE_MS ? " stale" : "");
    $("hTime").textContent = d.stamp_short || "";

    // rows
    var wrap = $("ranks");
    if (!agents.length){
      wrap.innerHTML = '<div class="empty"><b>No Core yet</b><span>The first one opens the board</span></div>';
      return;
    }
    var top = agents.slice(0, MAX_ROWS), max = top[0].core || 1;
    wrap.innerHTML = top.map(function(a, i){
      return '<div class="row'+(i===0?' r1':'')+'">' +
        '<div class="bar" style="width:'+((a.core/max)*100).toFixed(1)+'%"></div>' +
        '<div class="rk">'+(i+1)+'</div>' +
        '<div class="nm">'+esc(a.name)+'</div>' +
        '<div class="sub">'+(a.sthhc||0)+' STHHC &nbsp;·&nbsp; '+(a.hi||0)+' HI</div>' +
        '<div class="ct">'+a.core+'</div>' +
      '</div>';
    }).join("");

    // size rows to whatever fits — never a fixed height, never an overflow
    requestAnimationFrame(function(){
      var rows = wrap.querySelectorAll(".row");
      if (!rows.length) return;
      var h = rows[0].getBoundingClientRect().height;
      var u = U();
      var rk = Math.max(20*u, Math.min(52*u, h*0.46));
      var nm = Math.max(22*u, Math.min(58*u, h*0.52));
      var ct = Math.max(24*u, Math.min(66*u, h*0.62));
      var sb = Math.max(14*u, Math.min(26*u, h*0.26));
      rows.forEach(function(r){
        r.querySelector(".rk").style.fontSize = rk+"px";
        r.querySelector(".ct").style.fontSize = ct+"px";
        r.querySelector(".sub").style.fontSize = sb+"px";
        var n = r.querySelector(".nm");
        n.style.fontSize = nm+"px";
        fitText(n, nm, 18*u);
      });
    });
  }

  // ── the ticker ────────────────────────────────────────────
  var tickerSig = "";
  function renderTicker(d){
    var sales = (d && d.sales) || [];
    var sig = sales.map(function(s){ return s.id; }).join(",");
    if (sig === tickerSig) return;      // don't restart the scroll on an unchanged feed
    tickerSig = sig;

    var track = $("ttrack");
    var html;
    if (!sales.length){
      html = '<div class="titem idle"><span class="tdot"></span>' +
             '<span class="tnm">First Core of the day opens the board</span>' +
             '<span class="sep"></span></div>';
    } else {
      html = sales.map(function(s){
        return '<div class="titem"><span class="tdot"></span>' +
               '<span class="tnm">'+esc(s.agent)+'</span>' +
               '<span class="tpl">'+esc(s.plan || s.carrier || "Core")+'</span>' +
               '<span class="tat">'+esc(s.at||"")+'</span>' +
               '<span class="sep"></span></div>';
      }).join("");
    }
    // duplicate until the track comfortably exceeds the viewport, for a seamless loop
    track.style.animation = "none";
    track.innerHTML = html;
    var viewW = $("ticker").querySelector(".tview").clientWidth;
    var guard = 0;
    while (track.scrollWidth < viewW*2 && guard++ < 24){ track.innerHTML += html; }

    if (STATIC){ track.style.animation = "none"; track.style.transform = "translateX(0)"; return; }

    var half = track.scrollWidth/2;
    var dur = half / (TICKER_PXPS*U());
    var old = document.getElementById("tkf"); if (old) old.remove();
    var st = document.createElement("style"); st.id = "tkf";
    st.textContent = "@keyframes tkroll{from{transform:translateX(0)}to{transform:translateX(-"+half.toFixed(0)+"px)}}";
    document.head.appendChild(st);
    void track.offsetWidth;
    track.style.animation = "tkroll "+dur.toFixed(2)+"s linear infinite";
  }

  // ── feed polling + the shatter trigger ────────────────────
  // The shatter is a DIFF, not an event: Onyx has no push. It fires when
  // today's Core count rises above a baseline taken at load.
  var baseline = null;
  var curDay = null;

  function rearmIntro(){
    $("intro").classList.remove("gone");
    introLive = true;
    shattering = false;
    $("cracks").style.opacity = "0";
    $("flash").style.opacity = "0";
    buildIntro();
  }

  function apply(){
    var d = window.AEP;
    if (!d) return;
    var todayCore = (d.today && d.today.core) || 0;
    var day = etDateStr();

    render(d);
    renderTicker(d);

    // New selling day on a screen that never rebooted. Today's count has just
    // reset to 0, which is BELOW the baseline, so without this the board would
    // never shatter again -- yesterday's high-water mark would sit there
    // unbeatable. Re-arm for tomorrow's first Core.
    if (curDay !== null && day !== curDay){
      curDay = day;
      baseline = todayCore;
      rearmIntro();
      return;
    }
    curDay = day;

    if (baseline === null){
      baseline = todayCore;
      // Board started mid-day with Core already on the sheet: the moment has
      // passed, so go straight to the leaderboard rather than replaying it.
      if (todayCore > 0 && !forceIntro){
        $("intro").classList.add("gone");
        introLive = false;
      }
      return;
    }
    if (todayCore > baseline){
      baseline = todayCore;
      shatter();
    }
  }

  function poll(){
    var s = document.createElement("script");
    s.src = "/board/aep2027/feed.js?t=" + Date.now();
    s.onload = function(){ apply(); s.remove(); };
    s.onerror = function(){ s.remove(); };
    document.body.appendChild(s);
  }

  // ── boot ──────────────────────────────────────────────────
  var qs = new URLSearchParams(location.search);
  var forceIntro = qs.has("intro");

  fitStage();
  paintLogos();
  buildIntro();
  poll();
  setInterval(poll, POLL_MS);

  // Manual controls for the floor: S = shatter now, R = replay the intro.
  window.addEventListener("keydown", function(e){
    var k = e.key.toLowerCase();
    if (k === "s") shatter();
    // R re-arms: intro back up, baseline reset to the count as it stands now,
    // so the NEXT sale fires it rather than one already on the sheet.
    if (k === "r"){
      baseline = (window.AEP && window.AEP.today && window.AEP.today.core) || 0;
      rearmIntro();
    }
  });
})();
</script>
</body>
