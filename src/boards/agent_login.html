<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Sign-In | Get Health-e</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#eef7ff;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:#071827;background-image:radial-gradient(circle at 80% 0,#123e64 0,transparent 34%),linear-gradient(135deg,#061521,#0a2236 55%,#071827)}
.card{width:100%;max-width:440px;background:linear-gradient(145deg,#102b40e8,#0b2032e8);border:1px solid #ffffff16;border-radius:24px;padding:34px 30px;box-shadow:0 22px 55px #0004}
.logo{display:block;width:220px;max-width:80%;margin:0 auto 26px;filter:drop-shadow(0 6px 18px #0006)}
.eyebrow{font-size:12px;letter-spacing:.2em;color:#56c58b;font-weight:900;text-align:center}
h1{font-size:30px;margin:8px 0 6px;text-align:center}
p.sub{margin:0 0 26px;color:#9fb5c7;font-size:15px;text-align:center}
label{display:block;font-size:11px;letter-spacing:.16em;color:#70a7ca;font-weight:900;margin-bottom:8px}
input{width:100%;font-size:22px;letter-spacing:.08em;padding:14px 16px;border-radius:12px;border:1px solid #ffffff26;background:#07182799;color:#fff;outline:none}
input:focus{border-color:#35a8e0;box-shadow:0 0 0 3px #35a8e033}
button{width:100%;margin-top:18px;padding:15px;font-size:16px;font-weight:900;letter-spacing:.08em;border:0;border-radius:12px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#2489c8,#3fb5e8)}
button:hover{filter:brightness(1.08)}
.err{margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#c0392b26;border:1px solid #e74c3c55;color:#ffd6d1;font-size:14px}
.note{margin:20px 0 0;font-size:12px;color:#7f9aaf;text-align:center;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/me/logo.png" alt="Get Health-e">
  <div class="eyebrow">AGENT PERFORMANCE CENTER</div>
  <h1>Sign in</h1>
  <p class="sub">Enter your NPN to see your AEP dashboard.</p>
  <!--ERROR-->
  <form method="post" action="/login" autocomplete="off">
    <label for="npn">NPN</label>
    <input id="npn" name="npn" type="text" inputmode="numeric" pattern="[0-9 ]{5,12}" maxlength="12" required autofocus placeholder="e.g. 12345678">
    <button type="submit">VIEW MY DASHBOARD</button>
  </form>
  <p class="note">Your National Producer Number — the same one on your license.<br>You'll stay signed in on this device for 30 days.</p>
</main>
</body>
</html>
