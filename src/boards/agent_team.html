<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team | AEP Dashboards</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#eef7ff;min-height:100vh;background:#071827;
  background-image:radial-gradient(circle at 80% 0,#123e64 0,transparent 34%),linear-gradient(135deg,#061521,#0a2236 55%,#071827)}
.wrap{max-width:1200px;margin:auto;padding:24px 34px 40px}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18;gap:12px}
.logo{width:220px;max-width:50vw;max-height:58px;object-fit:contain;filter:drop-shadow(0 6px 18px #0006)}
.navright{display:flex;gap:14px;align-items:center;font-size:13px;color:#9fb5c7}
.menu{display:flex;gap:6px;margin-right:auto;margin-left:24px}
.menu a{padding:9px 14px;border-radius:10px;color:#9fb5c7;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.04em}
.menu a:hover{color:#fff;background:#ffffff0a}
.menu a.on{color:#fff;background:#2489c833;box-shadow:inset 0 0 0 1px #2489c866}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2489c8,#35a8e0);color:#fff;font-weight:900;font-size:15px;letter-spacing:.02em;box-shadow:0 4px 14px #2489c840}
.avatar:empty{display:none}
.uname{color:#eef7ff;font-weight:700;font-size:14px}
.logout{display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;border:1px solid #ffffff26;background:#ffffff0a;color:#cfe3f1;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.04em;transition:.15s}
.logout:hover{background:#c0392b;border-color:#c0392b;color:#fff}
.updated{margin-top:8px;font-size:12px;color:#f0b35a}
.updated:empty{display:none}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:28px 0 14px}
.tools input{flex:1;min-width:200px;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid #ffffff26;background:#07182799;color:#fff;outline:none}
.tools input:focus{border-color:#35a8e0}
.teampick{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#70a7ca;font-weight:900}
.teampick select{font:inherit;font-size:15px;font-weight:700;letter-spacing:0;color:#fff;padding:10px 12px;border-radius:10px;border:1px solid #ffffff26;background:#071827;min-width:200px;cursor:pointer}
.teampick select:focus{border-color:#35a8e0;outline:none}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
.tile{background:linear-gradient(145deg,#102b40e8,#0b2032e8);border:1px solid #ffffff16;border-radius:14px;padding:14px 16px}
.tile .k{font-size:10px;letter-spacing:.14em;color:#70a7ca;font-weight:900}
.tile .v{font-size:26px;font-weight:800;margin-top:6px}
.tile .v small{font-size:14px;color:#9fb5c7;font-weight:700}
.tile .s{font-size:12px;color:#9fb5c7;margin-top:4px}
.tile .bar{margin-top:8px}
.head button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;color:inherit}
.head button:hover{color:#fff}
.head button:focus-visible{outline:2px solid #35a8e0;outline-offset:3px;border-radius:4px}
.head .arrow{font-size:11px;opacity:.35}
.head button.on{color:#fff}
.head button.on .arrow{opacity:1;color:#5cc5ef}
.list{background:linear-gradient(145deg,#102b40e8,#0b2032e8);border:1px solid #ffffff16;border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1.4fr 70px 1fr 1fr 64px;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid #ffffff0d;color:inherit;text-decoration:none}
.row:first-child{border-top:0}
div.row[data-npn]{cursor:pointer}
div.row[data-npn]:hover{background:#ffffff08}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.head{font-size:10px;letter-spacing:.14em;color:#70a7ca;font-weight:900;background:#07182760}
.rank{color:#7f9aaf;font-weight:800;font-size:14px}
.name{font-weight:800;font-size:16px}
.metric{font-size:13px;color:#9fb5c7}
.metric b{color:#fff;font-size:17px;margin-right:3px}
.bar{height:6px;background:#ffffff12;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2489c8,#5cc5ef);border-radius:6px}
.bar.combo i{background:linear-gradient(90deg,#299e66,#62d99c)}
.go{color:#5a7d95;font-size:18px}
.plan{font-size:12px;font-weight:900;letter-spacing:.08em;color:#9fb5c7}
.plan b{display:inline-block;min-width:26px;padding:4px 8px;border-radius:8px;text-align:center;background:#ffffff10;color:#fff}
.plan b.B{background:#7a5af533;color:#cbbcff}
.plan b.A{background:#2489c833;color:#a9dcf7}
.plan b.C{background:#d9822b33;color:#ffd2a6}
.plan .none{color:#5a7d95}
.edit{font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;padding:7px 10px;border-radius:8px;border:1px solid #ffffff22;background:#ffffff0a;color:#cfe3f1;cursor:pointer}
.edit:hover{background:#2489c8;border-color:#2489c8;color:#fff}
.edited{display:block;font-size:10px;color:#7f9aaf;font-weight:400;letter-spacing:0;margin-top:3px}
.modal{position:fixed;inset:0;background:#020a12b3;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.box{width:100%;max-width:380px;background:#0e2638;border:1px solid #ffffff22;border-radius:16px;padding:22px;box-shadow:0 24px 60px #0008}
.box h2{margin:0 0 4px;font-size:20px}
.box .who{color:#9fb5c7;font-size:14px;margin-bottom:18px}
.box label{display:block;font-size:11px;letter-spacing:.12em;color:#70a7ca;font-weight:900;margin:12px 0 6px}
.box input,.box select{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #ffffff26;background:#071827;color:#fff;outline:none}
.box input:focus,.box select:focus{border-color:#35a8e0}
.box .err{color:#ffb4a8;font-size:13px;min-height:18px;margin-top:12px}
.box .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.box .btns button{font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid #ffffff22;cursor:pointer}
.box .cancel{background:transparent;color:#cfe3f1}
.box .save{background:#2489c8;border-color:#2489c8;color:#fff}
.box .save:disabled{opacity:.6;cursor:wait}
.empty{padding:30px;text-align:center;color:#9fb5c7}
@media(max-width:700px){.wrap{padding:16px}.uname{display:none}.summary{grid-template-columns:1fr 1fr}.teampick select{min-width:0}.menu{margin-left:8px}.menu a{padding:8px 8px;font-size:12px}.logo{width:120px}.row{grid-template-columns:30px 1fr 40px 1fr 56px;gap:10px;padding:12px 14px}.row .metric.combo,.head .h-combo{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><img class="logo" src="/me/logo.png" alt="Get Health-e"><div class="menu"><a class="on" href="/team">Agent Dashboards</a><a href="/team/draft">Coaching Draft</a></div><div class="navright"><div class="user"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="uname" id="who"></span></div><a class="logout" href="/logout">Sign out</a></div></nav>
  <div class="updated" id="updated"></div>
  <div class="tools">
    <label class="teampick"><span>TEAM</span><select id="team" aria-label="Team"><option value="all">All agents</option></select></label>
    <input id="q" type="search" placeholder="Find an agent" autocomplete="off">
  </div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="box" id="mForm" autocomplete="off">
    <h2 id="mTitle">Edit goals</h2>
    <div class="who" id="mWho"></div>
    <label for="mCore">CORE GOAL</label>
    <input id="mCore" type="number" min="1" max="1000" step="1" required>
    <label for="mCombo">STHHC + HI GOAL</label>
    <input id="mCombo" type="number" min="1" max="1000" step="1" required>
    <label for="mTeam">TEAM</label>
    <select id="mTeam"></select>
    <label for="mPlan">PLAN</label>
    <select id="mPlan">
      <option value="A">Option A</option>
      <option value="B">Option B</option>
      <option value="C">Option C</option>
      <option value="">None</option>
    </select>
    <div class="err" id="mErr"></div>
    <div class="btns"><button type="button" class="cancel" id="mCancel">Cancel</button><button type="submit" class="save" id="mSave">Save</button></div>
  </form>
</div>
<script>
(function () {
  var POLL_MS = 60 * 1000, STALE_MS = 3 * 60 * 60 * 1000;
  var $ = function (id) { return document.getElementById(id); };
  var data = null, sortKey = 'core', sortDir = -1, timer = null;
  var team = null; // 'all', a leader's name, or '__none'; set from the viewer on first load

  function teamOptions() {
    var sel = $('team'), leaders = (data && data.leaders) || [];
    var want = ['all'].concat(leaders, ['__none']).join('|');
    if (sel.getAttribute('data-opts') !== want) {
      sel.textContent = '';
      sel.appendChild(new Option('All agents', 'all'));
      leaders.forEach(function (n) { sel.appendChild(new Option(n, n)); });
      sel.appendChild(new Option('No team', '__none'));
      sel.setAttribute('data-opts', want);
    }
    // A manager lands on their own team; everyone else on the whole floor.
    if (team === null) team = leaders.indexOf(data.viewer && data.viewer.name) >= 0 ? data.viewer.name : 'all';
    sel.value = team;
  }
  function inTeam(r) {
    if (team === 'all') return true;
    if (team === '__none') return !r.leader;
    return r.leader === team;
  }
  function tile(k, sales, goal, isCombo) {
    var t = el('div', 'tile');
    t.appendChild(el('div', 'k', k));
    var v = el('div', 'v', String(sales));
    if (goal != null) v.appendChild(el('small', null, ' / ' + goal));
    t.appendChild(v);
    if (goal != null) {
      var pct = goal ? Math.round(sales / goal * 100) : 0;
      t.appendChild(el('div', 's', pct + '% to goal'));
      var bar = el('div', 'bar' + (isCombo ? ' combo' : '')), i = el('i');
      i.style.width = Math.min(100, pct) + '%';
      bar.appendChild(i);
      t.appendChild(bar);
    }
    return t;
  }
  function summary(rows) {
    var box = $('summary');
    box.textContent = '';
    var sum = function (k, f) { return rows.reduce(function (s, r) { return s + r[k][f]; }, 0); };
    var withSale = rows.filter(function (r) { return r.core.sales + r.combo.sales > 0; }).length;
    var agents = tile(team === 'all' ? 'AGENTS ON THE FLOOR' : 'AGENTS ON THE TEAM', rows.length, null);
    agents.appendChild(el('div', 's', withSale + ' with a sale'));
    box.appendChild(agents);
    box.appendChild(tile('CORE', sum('core', 'sales'), sum('core', 'goal'), false));
    box.appendChild(tile('STHHC + HI', sum('combo', 'sales'), sum('combo', 'goal'), true));
    var hit = rows.filter(function (r) { return r.core.sales >= r.core.goal; }).length;
    var t = tile('AT CORE GOAL', hit, null);
    t.appendChild(el('div', 's', 'of ' + rows.length + ' agents'));
    box.appendChild(t);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function metric(cls, m) {
    var box = el('div', 'metric ' + cls);
    box.appendChild(el('b', null, String(m.sales)));
    box.appendChild(document.createTextNode('/ ' + m.goal));
    var bar = el('div', 'bar' + (cls === 'combo' ? ' combo' : ''));
    var i = el('i');
    i.style.width = Math.min(100, m.goal ? Math.round(m.sales / m.goal * 100) : 0) + '%';
    bar.appendChild(i);
    box.appendChild(bar);
    return box;
  }

  function render() {
    if (!data) return;
    teamOptions();
    var q = $('q').value.trim().toLowerCase();
    var teamRows = data.rows.filter(inTeam);
    summary(teamRows);
    var rows = teamRows.slice().sort(function (a, b) {
      if (sortKey === 'name') return sortDir * a.name.localeCompare(b.name);
      if (sortKey === 'plan') return sortDir * (a.plan || 'Z').localeCompare(b.plan || 'Z') || a.name.localeCompare(b.name);
      return sortDir * (a[sortKey].sales - b[sortKey].sales) || a.name.localeCompare(b.name);
    });
    // Rank only means something on a best-first sales sort.
    var ranked = (sortKey === 'core' || sortKey === 'combo') && sortDir < 0;
    var list = $('list');
    list.textContent = '';
    var head = el('div', 'row head');
    [['', '', null], ['AGENT', '', 'name'], ['PLAN', '', 'plan'], ['CORE', '', 'core'], ['STHHC + HI', 'h-combo', 'combo'], ['', '', null]].forEach(function (c) {
      var cell = el('div', c[1]);
      if (c[2]) {
        var on = sortKey === c[2];
        var btn = el('button', on ? 'on' : '', c[0]);
        btn.type = 'button';
        btn.setAttribute('data-k', c[2]);
        btn.setAttribute('aria-label', 'Sort by ' + c[0].toLowerCase());
        btn.appendChild(el('span', 'arrow', on ? (sortDir < 0 ? '▼' : '▲') : '▲▼'));
        cell.appendChild(btn);
        cell.setAttribute('aria-sort', on ? (sortDir < 0 ? 'descending' : 'ascending') : 'none');
      }
      head.appendChild(cell);
    });
    list.appendChild(head);
    var shown = 0;
    rows.forEach(function (r, i) {
      if (q && r.name.toLowerCase().indexOf(q) < 0) return;
      var a = el('div', 'row');
      a.setAttribute('data-npn', r.npn);
      a.appendChild(el('div', 'rank', ranked ? String(i + 1) : ''));
      var nm = el('div', 'name');
      var link = el('a', null, r.name);
      link.href = '/me?agent=' + encodeURIComponent(r.npn);
      nm.appendChild(link);
      if (r.edited) nm.appendChild(el('span', 'edited', 'Goals edited by ' + r.edited.by));
      a.appendChild(nm);
      var plan = el('div', 'plan');
      if (r.plan) plan.appendChild(el('b', r.plan, r.plan));
      else { plan.appendChild(el('span', 'none', '-')); plan.title = 'No plan on file'; }
      a.appendChild(plan);
      a.appendChild(metric('core', r.core));
      a.appendChild(metric('combo', r.combo));
      var cell = el('div');
      var eb = el('button', 'edit', 'Edit');
      eb.type = 'button';
      eb.setAttribute('data-edit', r.npn);
      eb.setAttribute('aria-label', 'Edit goals for ' + r.name);
      cell.appendChild(eb);
      a.appendChild(cell);
      list.appendChild(a);
      shown++;
    });
    if (!shown) list.appendChild(el('div', 'empty', !data.rows.length ? 'No roster has been pushed yet.' : teamRows.length ? 'No agent matches that search.' : 'No agents on this team yet.'));

    var vname = data.viewer ? data.viewer.name : '';
    $('who').textContent = vname;
    var parts = vname.trim().split(/\s+/);
    $('avatar').textContent = parts[0] ? (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase() : '';
    // Only speak up when something is wrong: numbers hours old, or none yet.
    var u = $('updated');
    if (!data.generated_at) u.textContent = 'Waiting for the first update';
    else if (Date.now() - Date.parse(data.generated_at) > STALE_MS) u.textContent = 'These numbers are more than 3 hours old. The refresh may have stopped.';
    else u.textContent = '';
  }

  function load() {
    fetch('/api/team', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { location.href = '/'; return null; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { if (d) { data = d; render(); } })
      .catch(function () { $('updated').textContent = "Can't reach the server. Retrying."; });
  }

  $('q').addEventListener('input', render);
  $('team').addEventListener('change', function () { team = this.value; render(); });
  // Edit popup. Managers only: the server refuses anyone else.
  var editing = null;
  function openEdit(npn) {
    var r = data && data.rows.filter(function (x) { return x.npn === npn; })[0];
    if (!r) return;
    editing = r;
    $('mWho').textContent = r.name;
    $('mCore').value = r.core.goal;
    $('mCombo').value = r.combo.goal;
    $('mPlan').value = r.plan || '';
    var mt = $('mTeam');
    mt.textContent = '';
    (data.leaders || []).forEach(function (n) { mt.appendChild(new Option(n, n)); });
    mt.appendChild(new Option('No team', ''));
    mt.value = r.leader || '';
    $('mErr').textContent = '';
    $('mSave').disabled = false;
    $('modal').classList.add('open');
    $('mCore').focus();
  }
  function closeEdit() { $('modal').classList.remove('open'); editing = null; }
  $('mCancel').addEventListener('click', closeEdit);
  $('modal').addEventListener('click', function (e) { if (e.target === this) closeEdit(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editing) closeEdit(); });
  $('mForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!editing) return;
    var core = parseInt($('mCore').value, 10), combo = parseInt($('mCombo').value, 10);
    if (!(core >= 1 && core <= 1000) || !(combo >= 1 && combo <= 1000)) {
      $('mErr').textContent = 'Enter whole numbers from 1 to 1000.';
      return;
    }
    $('mSave').disabled = true;
    fetch('/api/team/goal', {
      method: 'POST', credentials: 'same-origin', cache: 'no-store',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ npn: editing.npn, core_goal: core, combo_goal: combo, plan: $('mPlan').value, leader: $('mTeam').value })
    }).then(function (r) {
      if (r.status === 401) { location.href = '/'; return null; }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Save failed'); return j; });
    }).then(function (j) { if (j) { closeEdit(); load(); } })
      .catch(function (err) { $('mErr').textContent = /^[A-Z]/.test(err.message) && err.message.length > 12 ? err.message : 'Could not save. Try again.'; $('mSave').disabled = false; });
  });

  // A row opens that agent's dashboard; the Edit button opens the popup instead.
  $('list').addEventListener('click', function (e) {
    var eb = e.target.closest && e.target.closest('[data-edit]');
    if (eb) { e.preventDefault(); openEdit(eb.getAttribute('data-edit')); return; }
    if (e.target.closest && e.target.closest('a, .head')) return;
    var row = e.target.closest && e.target.closest('div.row[data-npn]');
    if (row) location.href = '/me?agent=' + encodeURIComponent(row.getAttribute('data-npn'));
  });

  // Click a column heading to sort by it; click again to flip the direction.
  // Sales start best-first, names start A–Z.
  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.head button');
    if (!btn) return;
    var k = btn.getAttribute('data-k');
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === 'name' || k === 'plan') ? 1 : -1; }
    render();
  });
  function start() { if (!timer) timer = setInterval(load, POLL_MS); }
  function stop() { clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else { load(); start(); } });
  load();
  start();
})();
</script>
</body>
</html>
