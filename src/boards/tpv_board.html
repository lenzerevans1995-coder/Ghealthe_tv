<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TPV Completions — Floor Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600&display=swap">
<style>
:root{
  --ink:#04223A; --ink2:#08304F; --line:#12496F;
  --blue:#015A9C; --green:#0B9444; --gold:#F6B301;
  --paper:#F2F7FB; --mute:#7FA6C4;
  --cond:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
  --prose:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ink); color:var(--paper);
  font-family:var(--cond);
  display:flex; flex-direction:column;
  font-variant-numeric:tabular-nums;
}

/* header */
.head{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:clamp(14px,2.4vh,30px) clamp(24px,2.6vw,54px);
  background:var(--ink2); border-bottom:clamp(2px,.35vh,5px) solid var(--line);
}
.head h1{font-size:clamp(28px,4.6vh,54px);font-weight:800;letter-spacing:.012em;line-height:1}
.head .win{font-size:clamp(14px,2.1vh,25px);font-weight:600;color:var(--mute);letter-spacing:.09em;text-transform:uppercase}

/* main */
.main{flex:1;display:flex;min-height:0}
.grid{flex:1;min-width:0;padding:clamp(14px,2.2vh,30px) clamp(20px,2.2vw,46px)}
.rail{
  width:clamp(300px,25vw,480px); flex:none;
  background:var(--ink2); border-left:clamp(2px,.35vh,5px) solid var(--line);
  padding:clamp(16px,2.4vh,34px) clamp(18px,1.8vw,38px);
  display:flex; flex-direction:column; justify-content:center; gap:clamp(12px,2.2vh,30px);
}

table{width:100%;height:100%;border-collapse:collapse}
th{
  font-size:clamp(13px,2vh,24px);font-weight:700;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase;text-align:right;
  padding-bottom:clamp(6px,1vh,14px);
  border-bottom:clamp(2px,.3vh,4px) solid var(--line);
}
th:first-child{text-align:left}
td{
  font-size:clamp(24px,4.3vh,52px);font-weight:800;text-align:right;
  padding:clamp(4px,.75vh,12px) 0;
  border-bottom:1px solid rgba(18,73,111,.6);
}
td:first-child{text-align:left;font-weight:700;letter-spacing:.01em}
td.n0{color:var(--mute);font-weight:600}

tr.uncredited td{color:var(--mute);font-weight:600;font-size:clamp(19px,3.3vh,40px)}
tr.uncredited td:first-child{letter-spacing:.04em}
tr.total td{
  font-size:clamp(26px,4.6vh,56px);
  border-bottom:none;
  border-top:clamp(2px,.35vh,5px) solid var(--blue);
  padding-top:clamp(7px,1.1vh,16px);
  color:#fff;
}
/* more than 8 reps: the same rows, tighter, so the Floor row stays on screen */
table.dense td{font-size:clamp(20px,3.5vh,42px);padding:clamp(2px,.4vh,7px) 0}
table.dense tr.uncredited td{font-size:clamp(16px,2.8vh,32px)}
table.dense tr.total td{font-size:clamp(22px,3.8vh,46px);padding-top:clamp(5px,.8vh,12px)}

/* rail — the one accent moment */
.total-box{
  border:clamp(3px,.5vh,7px) solid var(--gold); border-radius:4px;
  padding:clamp(12px,2vh,28px) clamp(14px,1.4vw,28px);
  text-align:center;
}
.total-box .lab{font-size:clamp(14px,2.2vh,26px);font-weight:700;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.total-box .fig{font-size:clamp(76px,15vh,185px);font-weight:800;line-height:.88;color:var(--gold);margin-top:clamp(4px,.7vh,10px)}
.total-box .sub{font-size:clamp(13px,2vh,23px);font-weight:600;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:clamp(4px,.8vh,12px)}

.railstat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:clamp(8px,1.4vh,20px)}
.railstat .k{font-size:clamp(13px,2vh,24px);font-weight:700;color:var(--mute);letter-spacing:.09em;text-transform:uppercase}
.railstat .v{font-size:clamp(26px,4.6vh,56px);font-weight:800;line-height:1}

/* ask band */
.ask{
  background:var(--green);
  padding:clamp(14px,2.4vh,32px) clamp(24px,2.6vw,54px);
  display:flex;align-items:baseline;gap:clamp(14px,1.6vw,34px);flex-wrap:wrap;
}
.ask .big{font-size:clamp(26px,4.6vh,56px);font-weight:800;letter-spacing:.01em}
.ask .small{font-family:var(--prose);font-size:clamp(14px,2.1vh,25px);font-weight:400;color:#E4F3E8}
</style>
</head>
<body>

<div class="head">
  <h1>TPV COMPLETIONS</h1>
  <div class="win">October 1&ndash;15 &middot; Benefit Reps</div>
</div>

<div class="main">
  <div class="grid">
    <table>
      <thead>
        <tr><th>Rep</th><th>TPV</th><th>HRA</th></tr>
      </thead>
      <tbody>
        <tr class="uncredited"><td>Waiting for the first update</td><td></td><td></td></tr>
      </tbody>
    </table>
  </div>

  <div class="rail">
    <div class="total-box">
      <div class="lab">Total TPV</div>
      <div class="fig">126</div>
      <div class="sub">October to date</div>
    </div>
    <div class="railstat"><span class="k">HRA attached</span><span class="v">86%</span></div>
    <div class="railstat"><span class="k">Verifications / day</span><span class="v">11.5</span></div>
  </div>
</div>

<div class="ask">
  <span class="big">Put your name on every row.</span>
  <span class="small">15 verifications this month belong to nobody. They are your numbers &mdash; claim them.</span>
</div>

<script>
// New numbers without a reload: fetch this page every minute and swap in the
// parts that change. A failed fetch leaves the board as it is.
(function () {
  var parts = ['.head .win', '.grid', '.rail', '.ask'];
  function tick() {
    fetch(location.href, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      parts.forEach(function (sel) {
        var now = document.querySelector(sel), next = doc.querySelector(sel);
        if (now && next && now.innerHTML !== next.innerHTML) now.innerHTML = next.innerHTML;
      });
    }).catch(function () {});
  }
  setInterval(tick, 60000);
  // A long-running TV still picks up a new page design within the day.
  setTimeout(function () { location.reload(); }, 6 * 3600000);
})();
</script>
</body>
</html>
