<!doctype html><html><head><meta charset="utf-8"><title>Paper Chase — Team Breakdown</title>
<link rel="stylesheet" href="/board/contest-fonts.css">
<style>

:root{--field:#072A21;--edge:#04201A;--panel:#0B3A2E;--line:#155A46;--mint:#3FD68A;--gold:#F5C942;
--amber:#F2A43A;--paper:#F3F7F2;--mute:#8FB8A4;--dim:#5E8A76;
--disp:'Archivo Black','Oswald','Arial Narrow',sans-serif;--lab:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;--pro:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--edge)}
#wrap{position:fixed;inset:0;background:var(--edge);overflow:hidden}
#stage{width:1920px;height:1080px;position:fixed;top:50%;left:50%;transform-origin:center center;
  background:var(--field);color:var(--paper);font-family:var(--pro);display:flex;flex-direction:column}
.hdr{height:104px;background:var(--edge);border-bottom:3px solid var(--gold);display:flex;align-items:center;padding:0 56px;gap:32px;flex:none}
.hdr .brand{font-family:var(--disp);font-size:40px;color:var(--gold);letter-spacing:.5px;white-space:nowrap}
.hdr .sub{font-family:var(--lab);font-weight:700;font-size:26px;color:var(--mute);text-transform:uppercase;letter-spacing:2px;white-space:nowrap}
.hdr .stamp{margin-left:auto;text-align:right;font-family:var(--lab);font-weight:700;font-size:24px;color:var(--mute);text-transform:uppercase;letter-spacing:2px;line-height:1.1}
.hdr .stamp b{display:block;color:var(--paper);font-size:30px}
.main{flex:1 1 auto;display:flex;gap:28px;padding:22px 56px 0 56px;min-height:0}
.rail{width:470px;flex:none;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;gap:20px}
.ask{height:132px;flex:none;margin-top:22px;background:var(--gold);color:var(--edge);display:flex;align-items:center;padding:0 56px;gap:40px}
.ask .big{font-family:var(--disp);font-size:44px;line-height:1.05;white-space:nowrap}
.ask .fine{font-family:var(--pro);font-weight:600;font-size:21px;line-height:1.3;max-width:900px;margin-left:auto}
.lab{font-family:var(--lab);font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--mute)}
.num{font-family:var(--lab);font-weight:800;font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp)}
.gold{color:var(--gold)}.mint{color:var(--mint)}.amber{color:var(--amber)}.mute{color:var(--mute)}.dim{color:var(--dim)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px}

.main{padding-top:20px}
.grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:18px 20px}
.card{padding:8px 18px 6px;overflow:hidden;display:flex;flex-direction:column}
.card .top{display:flex;align-items:baseline;gap:12px;height:38px}
.card .top .rk{font-family:var(--lab);font-weight:800;font-size:30px;color:var(--mute)}
.card .top .tm{font-family:var(--disp);font-size:28px;flex:1 1 auto;white-space:nowrap}
.card.r1 .top .tm,.card.r1 .top .rk{color:var(--gold)}.card.r2 .top .tm,.card.r2 .top .rk{color:var(--mint)}
.card .top .tp{font-family:var(--lab);font-weight:800;font-size:34px}.card .top .tp small{font-size:18px;color:var(--mute);margin-left:4px}
.card .top .gr{font-family:var(--lab);font-weight:700;font-size:20px;color:var(--mute)}.card .top .gr b{color:var(--paper)}
.card .h{display:grid;grid-template-columns:1fr 90px 100px 90px;font-size:15px;padding:0 0 3px;border-bottom:2px solid var(--line)}
.card .h span:not(:first-child){text-align:right}
.ag{display:grid;grid-template-columns:1fr 90px 100px 90px;align-items:center;height:32px;border-bottom:1px solid #0f4536;font-family:var(--lab);font-weight:700;font-size:24px}
.ag:last-child{border-bottom:0}
.ag .n{font-family:var(--pro);font-weight:600;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.ag .p,.ag .s,.ag .c{text-align:right;font-variant-numeric:tabular-nums}
.ag .p{font-weight:800;font-size:26px}.ag .s{color:var(--mute)}
.ag.z .n,.ag.z .p,.ag.z .s,.ag.z .c{color:var(--dim)}
.ag.ok .p{color:var(--mint)}
.ag .c.b1{color:var(--mint)}.ag .c.b3{color:var(--gold)}
.ag .n i{font-style:normal;color:var(--mint);font-family:var(--lab);font-size:16px;margin-left:6px;letter-spacing:1px}

</style></head><body>
<div id="wrap"><div id="stage">
  <div class="hdr"><div class="brand">THE PAPER CHASE</div><div class="sub">Team Breakdown · every seat</div>
    <div class="stamp">Standings<b id="stamp">—</b></div></div>
  <div class="main"><div class="grid" id="grid"></div></div>
  <div class="ask"><div class="big">Beat your summer number.</div>
    <div class="fine"><b id="overCount">&nbsp;</b> are over their line so far. Clearing it enters
    the <b>$300 Beat-Your-Number draw</b> and doubles your Last Hat tickets; 30% past it triples
    them. <b>Green points</b> = 180 of your own, enough to cash a team prize.</div></div>
</div></div>
<script src="/board/contest.js"></script>
<script src="/board/paperchase/feed.js"></script>
<script>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
const QS = new URLSearchParams(location.search);
const OVERSCAN = Math.max(0, Math.min(10, Number(QS.get('overscan')) || 0));
function fit(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * (1 - OVERSCAN / 100);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); setInterval(fit, 2000); fit();
const plural = (n, one) => n + ' ' + (n === 1 ? one : one + 's');


function render() {
  const feed = window.PAPER_CHASE, C = window.PC_CONFIG;
  if (!feed || !C) return;
  const M = C.make(feed.rows), D = C.dates();
  $('#stamp').textContent = D.stamp;

  $('#grid').innerHTML = M.teamRows().map((t, i) => {
    const seats = t.members.map((a) => {
      const p = M.pts(a), s = M.summerOf(a);
      // green once a seat can cash its own share, grey while it is still at zero
      const cls = p === 0 ? 'z' : (p >= C.FLOOR_NUMBER ? 'ok' : '');
      const pc = Math.round(p / s * 100);
      return `<div class="ag ${cls}"><span class="n">${esc(a)}</span>` +
             `<span class="p">${p.toLocaleString('en-US')}</span>` +
             `<span class="s">${s.toLocaleString('en-US')}</span>` +
             `<span class="c ${M.beat(a) ? 'b1' : ''}">${pc}%</span></div>`;
    }).join('');
    return `<div class="card r${i + 1}">
      <div class="top"><span class="rk">${i + 1}</span><span class="tm">${esc(t.team)}</span>
        <span class="gr">grand <b>${money(t.grand)}</b></span>
        <span class="tp">${t.points.toLocaleString('en-US')}<small>PTS</small></span></div>
      <div class="h lab"><span>Agent</span><span>Points</span><span>Summer #</span><span>Of #</span></div>
      ${seats}</div>`;
  }).join('');

  const seatCount = Object.values(C.TEAMS).reduce((s, m) => s + m.length, 0);
  const over = Object.keys(C.TEAM_OF).filter((a) => M.beat(a)).length;
  $('#overCount').textContent = `${over} of ${seatCount}`;
}


render();
setInterval(async () => {
  try {
    const r = await fetch('/board/paperchase/feed.js?t=' + Date.now(), { credentials: 'same-origin' });
    if (!r.ok) return;
    const t = await r.text();
    window.PAPER_CHASE = JSON.parse(t.slice(t.indexOf('=') + 1).trim().replace(/;$/, ''));
    render();
  } catch (e) { /* keep the last good paint up */ }
}, 60000);

</script>
</body></html>
