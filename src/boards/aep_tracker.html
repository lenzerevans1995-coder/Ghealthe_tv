<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AEP Enrollment Pipeline — Top 10</title>
<link rel="stylesheet" href="/board/contest-fonts.css">
<style>
:root{
  --ink:#04223A; --ink2:#08304F; --line:#12496F;
  --blue:#015A9C; --green:#0B9444; --gold:#F6B301;
  --paper:#F2F7FB; --mute:#7FA6C4;
  --cond:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
  --prose:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;width:100vw;overflow:hidden;background:var(--ink);color:var(--paper)}
body{display:flex;flex-direction:column;font-family:var(--prose)}

.hdr{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(14px,2.2vh,30px) clamp(20px,2.6vw,54px);
  background:var(--ink2);border-bottom:clamp(3px,.45vh,6px) solid var(--gold);
}
.hdr h1{
  font-family:var(--cond);font-weight:800;letter-spacing:.015em;
  font-size:clamp(30px,5.0vh,62px);line-height:1;text-transform:uppercase;
}
.hdr h1 .hl{color:var(--gold)}
.hdr .meta{text-align:right;font-family:var(--cond);font-weight:600;color:var(--mute);
  font-size:clamp(14px,2.05vh,25px);line-height:1.25;text-transform:uppercase;letter-spacing:.05em}
.hdr .meta b{color:var(--paper);font-weight:700}

.main{flex:1 1 auto;display:flex;min-height:0}

.board{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;
  padding:clamp(10px,1.5vh,22px) clamp(18px,2.2vw,46px) clamp(6px,1.0vh,14px)}

.collbl{display:flex;align-items:flex-end;justify-content:space-between;
  font-family:var(--cond);font-weight:700;color:var(--mute);text-transform:uppercase;
  letter-spacing:.11em;font-size:clamp(11px,1.65vh,19px);
  padding:0 clamp(6px,.6vw,14px) clamp(4px,.7vh,9px);border-bottom:1px solid var(--line)}

.rows{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}

.row{position:relative;display:flex;align-items:center;
  padding:clamp(3px,.55vh,9px) clamp(6px,.6vw,14px);
  border-bottom:1px solid rgba(18,73,111,.55);overflow:hidden}
.bar{position:absolute;left:0;top:clamp(2px,.3vh,5px);bottom:clamp(2px,.3vh,5px);
  background:var(--blue);opacity:.30;border-radius:0 4px 4px 0;z-index:0}
.row.one .bar{background:var(--gold);opacity:.26}
.row>*:not(.bar){position:relative;z-index:1}

.rk{flex:0 0 clamp(44px,4.2vw,86px);font-family:var(--cond);font-weight:800;
  color:var(--mute);font-size:clamp(22px,3.7vh,46px);line-height:1}
.row.one .rk{color:var(--gold)}
.nm{flex:1 1 auto;font-family:var(--cond);font-weight:700;letter-spacing:.005em;
  font-size:clamp(24px,4.0vh,50px);line-height:1.05;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row.one .nm{font-weight:800;font-size:clamp(26px,4.5vh,58px)}
.ct{flex:0 0 clamp(110px,10vw,210px);text-align:right;font-family:var(--cond);font-weight:800;
  font-size:clamp(28px,4.6vh,58px);line-height:1}
.ct .of{color:var(--mute);font-weight:700;font-size:.55em;letter-spacing:.02em}
.row.one .ct{color:var(--gold);font-size:clamp(34px,6.2vh,80px)}
.row.one .ct .of{color:rgba(246,179,1,.62)}

.tail{flex:0 0 auto;padding:clamp(6px,1.0vh,14px) clamp(6px,.6vw,14px) 0;
  font-family:var(--prose);color:var(--mute);font-size:clamp(11px,1.65vh,19px);line-height:1.35}
.tail b{color:var(--paper);font-weight:700}

.rail{flex:0 0 clamp(300px,25vw,480px);background:var(--blue);
  display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,34px);
  padding:clamp(16px,2.4vh,38px) clamp(16px,1.8vw,36px);text-align:center}
.rail .lbl{font-family:var(--cond);font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;font-size:clamp(12px,1.85vh,22px);color:rgba(242,247,251,.78);
  line-height:1.2}
.big{font-family:var(--cond);font-weight:800;color:var(--gold);
  font-size:clamp(90px,17.5vh,210px);line-height:.86;
  animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}
@media (prefers-reduced-motion: reduce){.big{animation:none}}
.sub{font-family:var(--cond);font-weight:800;font-size:clamp(34px,6.0vh,76px);line-height:1}
.rule{height:1px;background:rgba(242,247,251,.26);margin:0 clamp(10px,2vw,36px)}

.ask{flex:0 0 auto;background:var(--green);
  padding:clamp(12px,2.1vh,30px) clamp(20px,2.6vw,54px);
  display:flex;align-items:center;justify-content:space-between;gap:clamp(16px,2vw,40px)}
.ask .big-ask{font-family:var(--cond);font-weight:800;text-transform:uppercase;
  letter-spacing:.012em;font-size:clamp(28px,4.7vh,58px);line-height:1.02}
.ask .why{font-family:var(--prose);font-weight:600;text-align:right;
  font-size:clamp(13px,2.0vh,24px);line-height:1.3;color:rgba(255,255,255,.93);flex:0 0 auto}
.ask .why b{font-weight:700;color:#fff}

.row.empty .nm{color:var(--mute);font-weight:600}
.stale{color:var(--gold)}
</style>
</head>
<body>

  <div class="hdr">
    <h1>AEP Enrollment Pipeline — <span class="hl">Top 10</span></h1>
    <div class="meta">
      Enrollment appts booked for <span id="wkLabel">week 1</span><br>
      <b id="win">10/15 – 10/21</b> &nbsp;·&nbsp; goal <b id="goal">40 per agent</b> &nbsp;·&nbsp; as of <b id="asof">—</b>
    </div>
  </div>

  <div class="main">
    <div class="board">
      <div class="collbl"><span>Agent</span><span id="colLbl">Week 1 booked / goal</span></div>
      <div class="rows" id="rows"></div>
      <div class="tail" id="tail"></div>
    </div>

    <div class="rail">
      <div>
        <div class="lbl" id="daysLbl">Days until AEP opens</div>
        <div class="big" id="days">—</div>
      </div>
      <div class="rule"></div>
      <div>
        <div class="lbl" id="floorLbl">Week 1 booked · floor</div>
        <div class="sub" id="floor">—</div>
      </div>
      <div>
        <div class="lbl">Agents on the board</div>
        <div class="sub" id="onBoard">—</div>
      </div>
    </div>
  </div>

  <div class="ask">
    <div class="big-ask" id="askText">40 enrollment appointments each, booked 10/15 – 10/21.</div>
    <div class="why" id="why"></div>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // Dates on Eastern time, whatever the TV's clock is set to.
  function etDate(d) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  }
  function md(iso) { var p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function daysBetween(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); }
  function asOf(iso) {
    var d = new Date(iso);
    var day = d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'America/New_York' });
    var dt = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', timeZone: 'America/New_York' });
    var tm = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    return day + ' ' + dt + ', ' + tm;
  }

  function render() {
    var f = window.AEP_TRACKER;
    if (!f || !Array.isArray(f.rows)) return;
    var goal = f.goal || 40;
    var w = f.window || { from: '2026-10-15', to: '2026-10-21', label: 'week 1' };
    var label = w.label || 'week 1';
    var Label = label.charAt(0).toUpperCase() + label.slice(1);
    var range = md(w.from) + ' – ' + md(w.to);
    $('wkLabel').textContent = label;
    $('win').textContent = range;
    $('goal').textContent = goal + ' per agent';
    $('colLbl').textContent = Label + ' booked / goal';
    $('floorLbl').textContent = Label + ' booked · floor';
    $('askText').textContent = goal + ' enrollment appointments each, booked ' + range + '.';
    $('asof').textContent = f.generated_at ? asOf(f.generated_at) : '—';
    $('asof').classList.toggle('stale', f.generated_at && Date.now() - Date.parse(f.generated_at) > 3 * 3600 * 1000);

    // Rank with ties sharing a place (1, 1, 3), best first, then by name.
    var rows = f.rows.slice().sort(function (a, b) { return (b.booked - a.booked) || a.agent.localeCompare(b.agent); });
    var rank = 0, prev = null;
    rows.forEach(function (r, i) { if (r.booked !== prev) { rank = i + 1; prev = r.booked; } r.rank = rank; });
    var top = rows.slice(0, 10);
    var max = top.length ? Math.max(1, top[0].booked) : 1;
    var box = $('rows');
    box.textContent = '';
    top.forEach(function (r) {
      var row = el('div', 'row' + (r.rank === 1 && r.booked > 0 ? ' one' : '') + (r.booked === 0 ? ' empty' : ''));
      var bar = el('div', 'bar'); bar.style.width = Math.round(r.booked / max * 100) + '%';
      row.appendChild(bar);
      row.appendChild(el('div', 'rk', String(r.rank)));
      row.appendChild(el('div', 'nm', r.agent));
      var ct = el('div', 'ct', String(r.booked));
      ct.appendChild(el('span', 'of', '/' + goal));
      row.appendChild(ct);
      box.appendChild(row);
    });

    var rest = rows.slice(10).filter(function (r) { return r.booked > 0; }).slice(0, 11);
    var tail = $('tail');
    tail.textContent = '';
    if (rest.length) {
      tail.appendChild(el('b', null, 'Just outside:'));
      tail.appendChild(document.createTextNode(' ' + rest.map(function (r) { return r.agent + ' ' + r.booked; }).join(' · ')));
    }

    var total = f.total != null ? f.total : rows.reduce(function (s, r) { return s + r.booked; }, 0);
    $('floor').textContent = total;
    $('onBoard').textContent = rows.filter(function (r) { return r.booked > 0; }).length + ' of ' + rows.length;

    // Rail and closing line follow the calendar: before AEP opens, the countdown;
    // during the week, days left in it.
    var today = etDate(new Date());
    var open = f.aep_open || w.from;
    var n, sentence;
    if (today < open) {
      n = daysBetween(today, open);
      $('daysLbl').textContent = 'Days until AEP opens';
      sentence = (WORDS[n] || n) + ' selling day' + (n === 1 ? '' : 's') + ' left to fill the week.';
    } else if (today <= w.to) {
      n = daysBetween(today, w.to) + 1;
      $('daysLbl').textContent = 'Days left in ' + label;
      sentence = (WORDS[n] || n) + ' day' + (n === 1 ? '' : 's') + ' left in ' + label + '.';
    } else {
      n = 0;
      $('daysLbl').textContent = Label + ' is done';
      sentence = Label + ' is in the books.';
    }
    $('days').textContent = n;

    var why = $('why');
    why.textContent = '';
    why.appendChild(el('b', null, String(total)));
    why.appendChild(document.createTextNode(' on the calendar for ' + label));
    if (f.week_ago_total != null) {
      why.appendChild(document.createTextNode(' — up from '));
      why.appendChild(el('b', null, String(f.week_ago_total)));
      why.appendChild(document.createTextNode(' a week ago.'));
    } else {
      why.appendChild(document.createTextNode('.'));
    }
    why.appendChild(el('br'));
    why.appendChild(document.createTextNode(sentence));
  }

  /* A socket pushes the moment a refresh lands; a slow poll runs underneath so a
     TV whose socket died quietly is never badly stale. */
  var pulling = false;
  function pull() {
    if (pulling) return;
    pulling = true;
    fetch('/board/aep/feed.js?t=' + Date.now(), { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (t) { window.AEP_TRACKER = JSON.parse(t.slice(t.indexOf('=') + 1).trim().replace(/;$/, '')); render(); }
      })
      .catch(function () { /* keep the last good paint up */ })
      .then(function () { pulling = false; });
  }
  setInterval(pull, 120000);
  // The countdown changes at midnight ET, not on a data push.
  setInterval(render, 60000);

  var ws = null, backoff = 1000;
  function connect() {
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/board/live-ws' + location.search);
    } catch (e) { return retry(); }
    ws.onopen = function () { backoff = 1000; pull(); };
    ws.onmessage = function (ev) { var m = {}; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.type === 'aep') pull(); };
    ws.onclose = retry;
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function retry() { ws = null; setTimeout(connect, backoff + Math.random() * 1000); backoff = Math.min(backoff * 2, 30000); }

  pull();
  connect();
})();
</script>
</body>
</html>
